name: Reuseable container workflow

env:
  NVCHECKER_VERSION: '2.20'
  DFUPDATE_VERSION: '2.2.2'
  GH_TOKEN: ${{ github.token }}

# One call = one leg (one WORKDIR). Normally called per workdir by container-update.yaml.
on:
  workflow_call:
    inputs:
      # Dockerfile ENV var holding the main software version; the image tag is [WORKDIR-]<its value>
      IMAGE_TAG:
        required: false
        type: string
      WORKDIR:
        required: false
        type: string
        default: .
      CICD_REF:
        required: false
        type: string
        default: "main"
        description: Ref (branch or tag) for CICD helper scripts.
      RUN_AUTOMATED_UPDATE_ON_PR:
        required: false
        type: boolean
        default: false
        description: Run automated container update job on pull_request instead of build-only.
      LATEST_TAG_WORKDIR:
        required: false
        type: string
        default: ""
        description: Optional workdir target that should receive the latest tag when no root (.) target is present.
      TIP_SHA:
        required: false
        type: string
        default: ""
        description: Default-branch tip resolved once by the plan job; publish-mode legs build exactly this commit.
      DATE_VERSION:
        required: false
        type: boolean
        default: false
        description: IMAGE_TAG names a date-version ENV (YYYY-MM-DD[-N]) that is bumped when an update changes the Dockerfile.
      RUN_DATE:
        required: false
        type: string
        default: ""
        description: UTC date (YYYY-MM-DD) resolved once by the plan job; empty means today.
      WORKDIRS:
        required: false
        type: string
        default: '["."]'
        description: JSON array of all workdirs of the caller (decides which paths belong to this leg).

jobs:

  # Run a standard build only on PR/MR create
  build-only:
    name: Container build
    if: github.event_name == 'pull_request' && inputs.RUN_AUTOMATED_UPDATE_ON_PR == false
    runs-on: ubuntu-latest
    env:
      WORKDIR: ${{ inputs.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - run: env | sort
      - run: df -h
      - run: rm -rf /opt/hostedtoolcache
      - run: df -h
      - run: docker build -t "${GITHUB_REPOSITORY}:$(date +%s)" .
        working-directory: ${{ env.WORKDIR }}

  # Update (schedule/dispatch/PR) or publish (push to the default branch) one leg:
  # build/test/push when needed and package artifacts for the release job.
  container-update:
    name: Automated container update (${{ inputs.WORKDIR }})
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && inputs.RUN_AUTOMATED_UPDATE_ON_PR)
      || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      WORKDIR: ${{ inputs.WORKDIR }}
      TARGET_NAME: ${{ inputs.WORKDIR }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      WORKDIRS: ${{ inputs.WORKDIRS }}
      # update: run nvchecker/dfupdate; publish: push to the default branch, build the committed Dockerfile as-is
      MODE: ${{ github.event_name == 'push' && 'publish' || 'update' }}
    steps:
      - name: Require the planned tip in publish mode
        if: env.MODE == 'publish'
        env:
          TIP_SHA: ${{ inputs.TIP_SHA }}
        run: |
          if [ -z "${TIP_SHA}" ]; then
            echo "::error::TIP_SHA is empty in publish mode (plan job did not run)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && inputs.TIP_SHA || '' }}
          fetch-depth: 0
      - name: Resolve CICD helper repo
        env:
          INPUT_CICD_REF: ${{ inputs.CICD_REF }}
          INPUT_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          repo="snw35/cicd"
          ref="${INPUT_CICD_REF:-}"
          if [ -z "$ref" ]; then
            workflow_ref="${INPUT_WORKFLOW_REF:-}"
            if [ -n "$workflow_ref" ] && [ "${workflow_ref#*@}" != "$workflow_ref" ]; then
              ref="${workflow_ref##*@}"
            elif [ "$GITHUB_REPOSITORY" = "$repo" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
              ref="${GITHUB_REF_NAME}"
            else
              ref="main"
            fi
          fi
          if [ "$repo" = "$GITHUB_REPOSITORY" ] && [ -d "${GITHUB_WORKSPACE}/.github/scripts" ]; then
            repo_dir="${GITHUB_WORKSPACE}"
            scripts_dir="${repo_dir}/.github/scripts"
            need_checkout="false"
          else
            repo_dir="${GITHUB_WORKSPACE}/.cicd"
            scripts_dir="${repo_dir}/.github/scripts"
            need_checkout="true"
          fi
          {
            echo "CICD_REPO=$repo"
            echo "CICD_REF=$ref"
            echo "CICD_REPO_DIR=$repo_dir"
            echo "CICD_SCRIPTS_DIR=$scripts_dir"
            echo "CICD_NEED_CHECKOUT=$need_checkout"
          } >> "$GITHUB_ENV"
      - name: Checkout CICD scripts
        if: env.CICD_NEED_CHECKOUT == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ env.CICD_REF }}
          token: ${{ secrets.GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}
          path: .cicd
          fetch-depth: 1
      - name: Ignore CICD helper checkout
        if: env.CICD_NEED_CHECKOUT == 'true'
        run: |
          exclude_file="${GITHUB_WORKSPACE}/.git/info/exclude"
          if [ -f "${exclude_file}" ] && ! grep -qx "/.cicd/" "${exclude_file}"; then
            echo "/.cicd/" >> "${exclude_file}"
          fi
      - name: Compute target slug
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | tr '/.' '-')
          echo "TARGET_SLUG=${TARGET_SLUG}" >> "$GITHUB_ENV"
      - run: env | sort
      - run: df -h
      - name: Run nvchecker
        if: env.MODE == 'update'
        run: docker run --rm --name nvchecker --mount "type=bind,source=${PWD},target=/data/" -w /data "snw35/nvchecker:${NVCHECKER_VERSION}" nvchecker -l debug -c nvchecker.toml
        working-directory: ${{ env.WORKDIR }}
      - name: Run dfupdate
        if: env.MODE == 'update'
        run: docker run --rm --name dfupdate --mount "type=bind,source=${PWD},target=/data/" -w /data "snw35/dfupdate:${DFUPDATE_VERSION}"
        working-directory: ${{ env.WORKDIR }}
      - name: Sync version snapshot
        if: env.MODE == 'update'
        run: |
          if [ -f new_ver.json ]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1; then
              sudo cp new_ver.json old_ver.json
              sudo chown "${owner}" old_ver.json
            else
              cp new_ver.json old_ver.json
              chown "${owner}" old_ver.json
            fi
          fi
        working-directory: ${{ env.WORKDIR }}
      - id: check_changes
        run: |
          if [[ $(git -C "$GITHUB_WORKSPACE" status --porcelain | wc -l) -eq 0 ]]; then
            echo "No repository changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Repository changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: sudo chown "$(id -u):$(id -g)" Dockerfile
        working-directory: ${{ env.WORKDIR }}
      - run: |
          if [ -f new_ver.json ]; then
            sudo chown "$(id -u):$(id -g)" new_ver.json
          fi
        working-directory: ${{ env.WORKDIR }}
      - run: pip3 install dockerfile-parse --break-system-packages
      - run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Date versions: validate the ENV in every mode; bump it only in update mode.
      - name: Date version
        if: inputs.DATE_VERSION
        env:
          RUN_DATE: ${{ inputs.RUN_DATE }}
        run: |
          extra=()
          if [ "${MODE}" != "update" ]; then
            extra+=(--no-bump)
          fi
          python3 "$CICD_SCRIPTS_DIR/date_version.py" --path Dockerfile --main "${IMAGE_TAG}" \
            --run-date "${RUN_DATE:-$(date -u +%F)}" --repo "${GITHUB_REPOSITORY}" --folder "${WORKDIR}" "${extra[@]}"
        working-directory: ${{ env.WORKDIR }}
      - name: Compute image tag
        run: |
          BASE_VERSION=$(python3 "$CICD_SCRIPTS_DIR/dockerfile_base_tag.py")
          TAG=$(python3 "$CICD_SCRIPTS_DIR/dockerfile_envs.py" --path Dockerfile alias --main "${IMAGE_TAG}" --folder "${WORKDIR}")
          VERSIONS=$(python3 "$CICD_SCRIPTS_DIR/dockerfile_envs.py" --path Dockerfile versions --base "${BASE_VERSION}")
          {
            echo "TAG=${TAG}"
            echo "VERSIONS=${VERSIONS}"
            echo "CHANGED=${{ steps.check_changes.outputs.changed }}"
            echo "IMAGE=${GITHUB_REPOSITORY}:${TAG}"
            echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          } >> "$GITHUB_ENV"
        working-directory: ${{ env.WORKDIR }}
      - name: Decide latest-tag owner
        env:
          INPUT_LATEST_TAG_WORKDIR: ${{ inputs.LATEST_TAG_WORKDIR }}
        run: |
          python3 "$CICD_SCRIPTS_DIR/latest_tag_owner.py" \
            --current-workdir "${WORKDIR}" \
            --latest-tag-workdir "${INPUT_LATEST_TAG_WORKDIR}" >> "$GITHUB_ENV"
      - run: env | sort
      # The published image is current when both registries hold the moving tag, its
      # revision label names a commit, and no non-bot, non-ignored file of this leg changed
      # since that commit (select_legs.py). In update mode the label is the checkout the
      # image was built from (before the bot commit), so at worst this rebuilds once more.
      - name: Check whether the published images are current
        run: |
          stale=false
          labels=""
          for ref in "$IMAGE" "$GHCR_IMAGE"; do
            if config="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' 2>"${RUNNER_TEMP}/inspect.err")"; then
              sha="$(python3 "$CICD_SCRIPTS_DIR/image_label.py" org.opencontainers.image.revision <<< "$config")"
              labels="${labels}${sha}|"
              if [ "$(python3 "$CICD_SCRIPTS_DIR/select_legs.py" stale "${WORKDIR}" "$sha")" = "true" ]; then
                echo "${ref} (built from '${sha}') is stale."
                stale=true
              else
                echo "${ref} is current (built from ${sha})."
              fi
            elif grep -Eqi 'no such manifest|manifest unknown|name unknown|not found' "${RUNNER_TEMP}/inspect.err"; then
              echo "${ref} is not in the registry."
              stale=true
            else
              echo "::error::Cannot read ${ref}: $(cat "${RUNNER_TEMP}/inspect.err")"
              exit 1
            fi
          done
          # A partial push leaves the registries on different builds.
          if [ "${labels%%|*}" != "$(cut -d'|' -f2 <<< "$labels")" ]; then
            echo "Docker Hub and ghcr carry different revision labels: stale."
            stale=true
          fi
          echo "IMAGE_STALE=${stale}" >> "$GITHUB_ENV"
      - name: Decide whether to publish
        run: |
          if [ "${CHANGED}" = "true" ] || [ "${IMAGE_STALE}" = "true" ]; then
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi
      - run: git clone --depth 1 https://github.com/docker-library/official-images.git ~/official-images
        if: env.PUBLISH == 'true'
      - run: rm -rf /opt/hostedtoolcache
        if: env.PUBLISH == 'true'
      - run: df -h
        if: env.PUBLISH == 'true'
      - run: |
          docker build -t "$IMAGE" \
            --label "org.opencontainers.image.revision=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" .
        if: env.PUBLISH == 'true'
        working-directory: ${{ env.WORKDIR }}
      - name: Validate root docker-compose stack
        if: env.PUBLISH == 'true'
        run: |
          compose_file="${GITHUB_WORKSPACE}/docker-compose.yaml"
          if [ ! -f "${compose_file}" ]; then
            echo "No root docker-compose.yaml found. Skipping compose validation."
            exit 0
          fi

          resolved_compose="$(mktemp)"
          docker compose -f "${compose_file}" config > "${resolved_compose}"
          if grep -Eqi '^[[:space:]]*gpus:[[:space:]]*' "${resolved_compose}" \
            || grep -Eqi 'capabilities:[[:space:]]*\[[^]]*(^|[^[:alnum:]_])gpu([^[:alnum:]_]|$)[^]]*\]' "${resolved_compose}" \
            || awk '
              BEGIN { in_caps=0 }
              /^[[:space:]]*capabilities:[[:space:]]*$/ { in_caps=1; next }
              in_caps && /^[[:space:]]*-[[:space:]]*gpu([[:space:]]|$)/ { found=1; exit }
              in_caps && /^[[:space:]]*[A-Za-z0-9_.-]+:[[:space:]]*/ { in_caps=0 }
              in_caps && /^[^[:space:]]/ { in_caps=0 }
              END { exit(found ? 0 : 1) }
            ' "${resolved_compose}"; then
            echo "GPU pass-through detected in ${compose_file}; skipping compose validation on non-GPU runner."
            exit 0
          fi

          if [ -n "${WORKDIR}" ] && [ "${WORKDIR}" != "." ]; then
            docker tag "${IMAGE}" "${GITHUB_REPOSITORY}:${WORKDIR}"
          else
            docker tag "${IMAGE}" "${GITHUB_REPOSITORY}:latest"
          fi

          cleanup() {
            docker compose -f "${compose_file}" down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          echo "Running compose stack from ${compose_file} using locally built images"
          docker compose -f "${compose_file}" up -d --no-build --pull never
          sleep 10

          failed=0
          container_ids="$(docker compose -f "${compose_file}" ps -q)"
          for cid in ${container_ids}; do
            name="$(docker inspect --format '{{.Name}}' "${cid}" | sed 's#^/##')"
            status="$(docker inspect --format '{{.State.Status}}' "${cid}")"
            if [ "${status}" = "stopped" ] || [ "${status}" = "exited" ] || [ "${status}" = "dead" ] || [ "${status}" = "restarting" ]; then
              echo "::error::Compose container ${name} is in unhealthy state: ${status}"
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::Compose validation failed because one or more containers are stopped/exited/dead or restarting."
            exit 1
          fi
      - run: ~/official-images/test/run.sh "$IMAGE" || exit 1;
        if: env.PUBLISH == 'true'
      - run: docker tag "$IMAGE" "${GITHUB_REPOSITORY}:${WORKDIR}"
        if: env.PUBLISH == 'true' && env.WORKDIR != '' && env.WORKDIR != '.'
      - run: docker push "${GITHUB_REPOSITORY}:${WORKDIR}"
        if: env.PUBLISH == 'true' && env.WORKDIR != '' && env.WORKDIR != '.'
      - run: docker tag "$IMAGE" "ghcr.io/${GITHUB_REPOSITORY}:${WORKDIR}"
        if: env.PUBLISH == 'true' && env.WORKDIR != '' && env.WORKDIR != '.'
      - run: docker push "ghcr.io/${GITHUB_REPOSITORY}:${WORKDIR}"
        if: env.PUBLISH == 'true' && env.WORKDIR != '' && env.WORKDIR != '.'
      - run: docker tag "$IMAGE" "${GITHUB_REPOSITORY}:latest"
        if: env.PUBLISH == 'true' && env.APPLY_LATEST_TAG == 'true'
      - run: docker push "${GITHUB_REPOSITORY}:latest"
        if: env.PUBLISH == 'true' && env.APPLY_LATEST_TAG == 'true'
      - run: docker tag "$IMAGE" "ghcr.io/${GITHUB_REPOSITORY}:latest"
        if: env.PUBLISH == 'true' && env.APPLY_LATEST_TAG == 'true'
      - run: docker push "ghcr.io/${GITHUB_REPOSITORY}:latest"
        if: env.PUBLISH == 'true' && env.APPLY_LATEST_TAG == 'true'
      # The moving tag is pushed last: only its label is checked, so a partial failure
      # above leaves it stale and the next run republishes.
      - run: docker push "$IMAGE"
        if: env.PUBLISH == 'true'
      - run: docker tag "$IMAGE" "$GHCR_IMAGE"
        if: env.PUBLISH == 'true'
      - run: docker push "$GHCR_IMAGE"
        if: env.PUBLISH == 'true'
      - run: docker images
        if: env.PUBLISH == 'true'
      - name: Read image digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"
      - name: Stage and package repository changes
        if: env.CHANGED == 'true'
        run: |
          git -C "$GITHUB_WORKSPACE" add -A
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo "No repository changes to package for ${TARGET_NAME}"
          else
            git -C "$GITHUB_WORKSPACE" diff --binary --cached > "/tmp/${TARGET_SLUG}-changes.patch"
          fi
      - name: Write update metadata
        run: |
          cat > "/tmp/${TARGET_SLUG}-meta.json" <<EOF
          {
            "name": "${TARGET_NAME}",
            "workdir": "${WORKDIR}",
            "mode": "${MODE}",
            "changed": "${CHANGED}",
            "published": "${PUBLISH}",
            "alias": "${TAG}",
            "digest": "${DIGEST}",
            "versions": ${VERSIONS},
            "image": "${IMAGE}",
            "ghcr_image": "${GHCR_IMAGE}",
            "tip_sha": "$(git rev-parse HEAD)"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: update-${{ env.TARGET_SLUG }}-${{ github.run_id }}
          path: |
            /tmp/${{ env.TARGET_SLUG }}-*
          if-no-files-found: error
          overwrite: true
